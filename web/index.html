<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wayfinder — live bus stop monitoring</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b6bcb'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body class="mode-live">

  <header class="bar">
    <div class="brand">
      <span class="logo">RTL</span>
      <strong>Wayfinder</strong>
      <span class="tagline">live bus stop monitoring</span>
    </div>

    <label class="field">
      <span>Demand</span>
      <select id="scenario"></select>
    </label>

    <div class="modes" role="tablist" aria-label="View mode">
      <button class="mode active" id="mode-live" role="tab" aria-selected="true" type="button">Live</button>
      <button class="mode" id="mode-snap" role="tab" aria-selected="false" type="button">Snapshots</button>
    </div>

    <button class="info-btn" id="info-btn" type="button" aria-label="About this data">i</button>
  </header>

  <main>
    <!-- The one thing that matters: the camera, with boxes drawn on it. -->
    <section class="viewer">
      <div class="stage" id="stage">
        <video id="video" autoplay loop muted playsinline></video>
        <img id="snapshot" alt="" hidden>
        <canvas id="overlay" aria-hidden="true"></canvas>

        <div class="live-badge" id="live-badge"><span class="dot"></span><span id="live-text">starting…</span></div>

        <div class="count-badge">
          <span class="count" id="waiting-count">–</span>
          <span class="count-label">people waiting</span>
        </div>

        <div class="stage-foot">
          <span id="frame-note">–</span>
        </div>
      </div>

      <div class="readout">
        <p class="sentence" id="sentence">Loading…</p>
        <div class="numbers">
          <div><b id="n-frame">–</b><span>people in view</span></div>
          <div><b id="n-arrivals">–</b><span>arriving / min</span></div>
          <div><b id="n-headway">–</b><span>run buses every</span></div>
        </div>
        <div class="facts" id="facts"></div>
      </div>
    </section>

    <aside class="side">
      <div class="side-head">
        <h1 id="stop-name">Loading…</h1>
        <p id="stop-sub">–</p>
      </div>

      <div class="map-wrap"><div id="map"></div></div>

      <div class="side-foot">
        <p class="small" id="camera-note">–</p>
        <button class="link-btn" id="about-btn" type="button">What am I looking at?</button>
      </div>
    </aside>
  </main>

  <dialog id="about" class="sheet">
    <h2>What am I looking at?</h2>
    <div id="about-body"></div>
    <form method="dialog"><button class="primary">Close</button></form>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
